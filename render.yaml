services:
  - type: web
    name: astro-trading-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
    autoDeploy: true
    branch: main
