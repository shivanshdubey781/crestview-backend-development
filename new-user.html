<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Trading - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full text-gray-300 flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
    <div class="max-w-md w-full space-y-8 p-8">
        <!-- Logo/Header -->
        <div class="text-center">
            <h1 class="text-4xl font-bold text-white mb-2">Astro Trading</h1>
            <p class="text-gray-400">Create your account</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded-lg text-sm">
            <span id="error-text"></span>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="hidden bg-green-900 border border-green-700 text-green-200 px-4 py-3 rounded-lg text-sm">
            <span id="success-text"></span>
        </div>

        <!-- Sign Up Form -->
        <form id="signup-form" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="Choose a username"
                >
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="Enter your email"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="Create a password (min 6 chars)"
                >
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    name="confirm-password" 
                    required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="Confirm your password"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200"
            >
                Create Account
            </button>
        </form>

        <!-- Sign In Link -->
        <div class="text-center">
            <p class="text-gray-400 text-sm">
                Already have an account? 
                <button 
                    type="button" 
                    onclick="window.location.href='User-login.html'"
                    class="text-blue-400 hover:text-blue-300 font-semibold transition"
                >
                    Sign In
                </button>
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Handle sign up form submission
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            try {
                // Show loading state
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Creating account...';
                submitBtn.disabled = true;

                // Send signup request to backend
                const response = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Show success message
                    showSuccess('Account created successfully! Redirecting to login...');
                    
                    // Clear form
                    document.getElementById('signup-form').reset();

                    // Redirect to login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'User-login.html';
                    }, 2000);
                } else {
                    // Show error message
                    showError(result.message || 'Sign up failed. Please try again.');
                    submitBtn.textContent = 'Create Account';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Sign up error:', error);
                showError('Error connecting to server. Please check your connection.');
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Create Account';
                submitBtn.disabled = false;
            }
        });

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');

            // Auto hide after 5 seconds
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            successText.textContent = message;
            successDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
