
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Trading - Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
    }
    
    .fade-in { 
      opacity: 0; 
      animation: fadeIn 0.6s ease forwards; 
    }
    
    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(10px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
  </style>
</head>

<body class="h-full flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">

  <div class="max-w-md w-full space-y-8 p-8 fade-in">

    <!-- Header -->
    <div class="text-center">
      <h1 class="text-4xl font-bold text-white mb-3 tracking-wide">Astro Trading</h1>
      <p class="text-gray-400 text-sm">Login to access your dashboard</p>
    </div>

    <!-- Error Message -->
    <div id="error-msg" class="hidden bg-red-800 border border-red-600 text-red-200 text-sm px-4 py-3 rounded-lg">
      <span id="err-text"></span>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="space-y-4">

      <div>
        <label class="text-sm font-medium text-gray-300">Email</label>
        <input 
          id="email" 
          type="email" 
          required
          placeholder="Enter your email"
          class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="text-sm font-medium text-gray-300">Password</label>
        <div class="relative">
          <input 
            id="password" 
            type="password" 
            required
            placeholder="Enter your password"
            class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10"
          >
          <span 
            id="togglePassword" 
            class="absolute right-3 top-3 text-gray-400 cursor-pointer text-xl hover:text-gray-200"
          >
            👁️
          </span>
        </div>
      </div>

      <button 
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition duration-200"
      >
        Sign In
      </button>
    </form>

    <!-- Sign Up Link -->
    <div class="text-center mt-4">
      <p class="text-gray-400 text-sm">
        Don't have an account? 
        <a href="new-user.html" class="text-blue-400 hover:text-blue-300 font-semibold">Register</a>
      </p>
    </div>

  </div>

  <!-- Script for Login -->
  <script>
    const API_URL = "http://localhost:5000";

    // Handle login form submission
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = e.target.querySelector("button");

      // Validate inputs
      if (!email || !password) {
        showError("Please enter both email and password");
        return;
      }

      btn.textContent = "Signing in...";
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/signin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.message || "Invalid login credentials");
          btn.textContent = "Sign In";
          btn.disabled = false;
          return;
        }

        // Store session in localStorage
        localStorage.setItem("userId", data.userId);
        localStorage.setItem("username", data.username);

        console.log("✅ Login successful. Redirecting...");
        
        // Redirect to User-Data.html (with correct case)
        window.location.href = "User-Data.html";

      } catch (err) {
        console.error("Login error:", err);
        showError("Server connection failed. Please try again later.");
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    });

    // Show error message
    function showError(msg) {
      const errorDiv = document.getElementById("error-msg");
      const errorText = document.getElementById("err-text");
      
      errorText.textContent = msg;
      errorDiv.classList.remove("hidden");

      // Auto-hide after 5 seconds
      setTimeout(() => {
        errorDiv.classList.add("hidden");
      }, 5000);
    }

    // Toggle password visibility - Fixed version
    const setupPasswordToggle = () => {
      const toggle = document.getElementById("togglePassword");
      const pwd = document.getElementById("password");

      if (toggle && pwd) {
        toggle.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          
          const currentType = pwd.getAttribute("type");
          const newType = currentType === "password" ? "text" : "password";
          
          pwd.setAttribute("type", newType);
          toggle.textContent = newType === "password" ? "👁️" : "🙈";
          
          console.log("Password visibility toggled:", newType);
        });
        
        console.log("✅ Password toggle initialized");
      } else {
        console.error("❌ Password toggle elements not found");
      }
    };

    // Initialize password toggle immediately after DOM loads
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupPasswordToggle);
    } else {
      setupPasswordToggle();
    }
  </script>

</body>
</html>
